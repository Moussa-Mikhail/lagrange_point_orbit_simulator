name: update-requirements
on:
  push:
    paths:
      - pyproject.toml
      - uv.lock
      - update-requirements.sh
      - .github/workflows/update-requirements.yml

permissions:
  contents: write

jobs:
  update-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # uv sync would otherwise pick the newest Python on the runner, and numba doesn't support that yet
          python-version: "3.13"
      - run: ./update-requirements.sh
        shell: bash
      - uses: EndBug/add-and-commit@v11
        with:
          message: "build(deps): update requirements"
          default_author: github_actions
