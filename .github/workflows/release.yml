name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create the Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          # the history is needed to check the tag is on main and to list the commits in the release
          fetch-depth: 0
      -
        name: Check the Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Releases are made from main."
            exit 1
          fi
      -
        name: Check the Tag Matches the Package Version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version $version in pyproject.toml"
            exit 1
          fi
      -
        name: Write the Release Notes
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > RELEASE_NOTES.md
      -
        name: Create the Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          # a version like 0.3.0rc1 is a pre-release
          prerelease: ${{ contains(github.ref_name, 'rc') }}
