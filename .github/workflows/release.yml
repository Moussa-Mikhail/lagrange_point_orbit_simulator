name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Setup uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.13'
      -
        name: Build Simulator
        run: sh ./build.sh
      -
        name: Smoke Test
        run: QT_QPA_PLATFORM=offscreen dist/sim_gui/sim_gui --self-test
      -
        name: Compress App
        run: |
          cd dist
          zip -r MacOS-Extract.zip sim_gui.app
      -
        name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacOS-Extract
          path: dist/MacOS-Extract.zip
          if-no-files-found: error
          retention-days: 2

  build-ubuntu:
    # Use the oldest available image so the binary runs on as many glibc versions as possible.
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Setup uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.13'
      -
        name: Build Simulator
        run: sh ./build.sh
      -
        name: Install Qt Runtime Libraries
        # The runner image is minimal. Desktop Linux installs normally have these.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      -
        name: Smoke Test
        run: QT_QPA_PLATFORM=offscreen timeout 120 dist/sim_gui/sim_gui --self-test
      -
        name: Compress App
        run: |
          cd dist
          tar -czvf Ubuntu-Extract.tar.gz sim_gui
      -
        name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ubuntu-Extract
          path: dist/Ubuntu-Extract.tar.gz
          if-no-files-found: error
          retention-days: 2

  build-windows:
    runs-on: windows-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Setup uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          python-version: '3.13'
      -
        name: Build Simulator
        run: ./build.sh
        shell: bash
      -
        name: Smoke Test
        # the app has no console, so wait for it and use its exit code
        run: |
          $app = Start-Process dist/sim_gui/sim_gui.exe -ArgumentList "--self-test" -Wait -PassThru
          exit $app.ExitCode
        shell: pwsh
      -
        name: Compress App
        run: |
          cd dist
          7z.exe a -tzip -mm=Deflate -mx=5 Windows-Extract.zip sim_gui
      -
        name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Extract
          path: dist/Windows-Extract.zip
          if-no-files-found: error
          retention-days: 2

  create-release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-ubuntu, build-macos]
    # A manual run only builds and smoke tests. Releases come from version tags.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Check the Tag Matches the Package Version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version $version in pyproject.toml"
            exit 1
          fi
      -
        name: Get All Artifacts
        uses: actions/download-artifact@v8
      -
        name: Extract Version Metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "version_short=${GITHUB_REF##*/v}" >> $GITHUB_ENV
      -
        name: Rename Files
        run: |
          mv Windows-Extract/Windows-Extract.zip      SimGui.${{ env.version_short }}-Windows.zip
          mv Ubuntu-Extract/Ubuntu-Extract.tar.gz     SimGui.${{ env.version_short }}-Linux.tar.gz
          mv MacOS-Extract/MacOS-Extract.zip          SimGui.${{ env.version_short }}-macOS.zip
      -
        name: Write Checksums
        run: sha256sum SimGui.* > SHA256SUMS.txt
      -
        name: Upload Files
        uses: softprops/action-gh-release@v3
        with:
          files: |
            SimGui.${{ env.version_short }}-Windows.zip
            SimGui.${{ env.version_short }}-Linux.tar.gz
            SimGui.${{ env.version_short }}-macOS.zip
            SHA256SUMS.txt
