[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lagrange-point-orbit-simulator"
version = "0.1.0"
description = "Simulates orbits near Lagrange Points"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"

authors = [
    { name = "Moussa Mikhail", email = "moussamikhail56@gmail.com" },
]

keywords = ["lagrange point", "orbit", "simulation", "physics", "gui", "astronomy"]

classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numba>=0.64.0",
    "numpy>=2.4.2",
    "validateddescriptor",
]

[project.urls]
Repository = "https://github.com/Moussa-Mikhail/lagrange_point_orbit_simulator"

[project.optional-dependencies]
gui = [
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lagrangepointsimulator", "src/lagrangepointgui"]

[tool.uv.sources]
validateddescriptor = { git = "https://github.com/Moussa-Mikhail/validated-descriptor.git" }

[dependency-groups]
dev = [
    "refurb>=2.3.0",
    "ruff>=0.15.5",
    "sourcery>=1.43.0",
    "ty>=0.0.21",
    "lagrange-point-orbit-simulator[gui]",
]

build = [
    "pyinstaller>=5.11.0",
]

[tool.uv]
default-groups = "all"

[tool.ruff]
lint.ignore = ['EXE002']
line-length = 120
