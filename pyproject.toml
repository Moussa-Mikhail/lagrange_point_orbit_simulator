[project]
name = "lagrange-point-orbit-simulator"
version = "0.3.0"
description = "Simulates orbits near Lagrange Points"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"

authors = [
    { name = "Moussa Mikhail", email = "moussamikhail56@gmail.com" },
]

keywords = ["lagrange point", "orbit", "simulation", "physics", "gui", "astronomy"]

classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy>=2.4.2",
    "validateddescriptor @ git+https://github.com/Moussa-Mikhail/validated-descriptor.git",
]

[project.urls]
Repository = "https://github.com/Moussa-Mikhail/lagrange_point_orbit_simulator"

[project.optional-dependencies]
numba = [
    "numba>=0.64.0",
]
gui = [
    "numba>=0.64.0",
    "pyqt6>=6.10.2",
    "pyqtgraph>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# validateddescriptor isn't on PyPI, so pip installs it from git
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/lagrangepointsimulator",
    "src/lagrangepointinputs",
    "src/lagrangepointapi",
    "src/lagrangepointgui",
]

[dependency-groups]
test = [
    "pytest>=8.0",
]

dev = [
    "pre-commit>=4.0",
    "refurb>=2.3.0",
    "ruff>=0.15.5",
    "sourcery>=1.43.0",
    "ty>=0.0.21",
    "lagrange-point-orbit-simulator[gui,numba]",
    {include-group = "test"},
]

build = [
    "pyinstaller>=5.11.0",
]

[tool.uv]
default-groups = "all"

# refurb runs mypy, which needs to know that src is a source root and not a package
[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
lint.ignore = ['EXE002']
line-length = 120
