# Install the hooks once per clone with: uv run pre-commit install
# The same checks run in CI (.github/workflows/checks.yml), which is what enforces them.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run ty check src
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
      - id: refurb
        name: refurb
        entry: uv run refurb src tests scripts
        language: system
        types: [python]
        pass_filenames: false
      - id: sourcery
        name: sourcery
        entry: uv run sourcery review --check --no-summary
        language: system
        types: [python]
      - id: requirements
        name: regenerate requirements*.txt
        entry: ./update-requirements.sh
        language: system
        files: ^(pyproject\.toml|uv\.lock|update-requirements\.sh)$
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
