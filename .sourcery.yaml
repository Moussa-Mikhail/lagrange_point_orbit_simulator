ignore:
    - .git
    - venv
    - .venv
    - env
    - .env
    - .tox
    - node_modules
    - vendor
    - dist

rule_settings:
  enable: [default]
  # These conflict with ruff rules (EM101/EM102, RET505) or are a matter of taste
  disable:
    - use-named-expression
    - reintroduce-else
    - swap-if-else-branches
    - assign-if-exp
  rule_types:
    - refactoring
    - suggestion
    - comment
  python_version: '3.13'

rules: []

metrics:
  quality_threshold: 25.0

github:
  labels: []
  ignore_labels:
    - sourcery-ignore
  request_review: author
  sourcery_branch: sourcery/{base_branch}

clone_detection:
  min_lines: 3
  min_duplicates: 2
  identical_clones_only: false

proxy:
  no_ssl_verify: false
